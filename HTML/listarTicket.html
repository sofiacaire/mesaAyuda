<html Lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Tickets del cliente - Mesa de Ayuda</title>
    <style type="text/css">
        ul.breadcrumb {
            padding: 10px 16px;
            list-style: none;
            background-color: #eee;
        }

        /* Display list items side by side */
        ul.breadcrumb li {
            display: inline;
            font-size: 18px;
        }

        /* Add a slash symbol (/) before/behind each list item */
        ul.breadcrumb li+li:before {
            padding: 8px;
            color: black;
            content: "/\00a0";
        }

        /* Add a color to all links inside the list */
        ul.breadcrumb li a {
            color: #0275d8;
            text-decoration: none;
        }

        /* Add a color on mouse-over */
        ul.breadcrumb li a:hover {
            color: #01447e;
            text-decoration: underline;
        }

        .client-info {
            border-collapse: collapse;
            margin: 12px auto;
            min-width: 320px;
        }

        .client-info th,
        .client-info td {
            border: 1px solid black;
            padding: 8px 12px;
            text-align: left;
        }
    </style>
</head>

<body>
    <center><img src="HelpDeskGirl.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;"></center>
    <center>
        <ul class="breadcrumb">
            <li><a href="http://127.0.0.1:5500/loginClient.html">Login</a></li>
            <li>Listar tickets</li>
        </ul>
    </center>
    <center>
        <h1>Sistema de Mesa de Ayuda</h1>
    </center>
    <center>
        <h2>Tickets activos para usuario</h2>
    </center>
    <center>
        <table class="client-info" aria-label="Datos del cliente">
            <tbody>
                <tr>
                    <th scope="row">ID (correo electrónico)</th>
                    <td id="clientEmail"></td>
                </tr>
                <tr>
                    <th scope="row">Contacto</th>
                    <td id="clientContact"></td>
                </tr>
                <tr>
                    <th scope="row">Nombre</th>
                    <td id="clientName"></td>
                </tr>
                <tr>
                    <th scope="row">Fecha de último ingreso</th>
                    <td id="clientLastLogin"></td>
                </tr>
            </tbody>
        </table>
    </center>
    <center>
        <p id="mensajes"></p>
    </center>
    <center>
        <div id="app"></div>
    </center>


    <script src="listarTicket.js" type="module"></script>

</body>
